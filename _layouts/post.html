---
layout: default
---
<article class="post">
  <header>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
  </header>
  {% if page.image %}<img class="cover" src="{{ page.image | relative_url }}" alt="">{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
<p class="back"><a href="{{ '/' | relative_url }}">&larr; All posts</a></p>
