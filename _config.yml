# Site settings: change the title, tagline and author here.
title: Elemental Curiosity
description: Following curiosity down to the elements.
author: Stephon
url: "https://elementalcuriosity.com"
baseurl: ""

permalink: /:title/
markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "about.md"
    values:
      layout: page
      permalink: /about/

exclude:
  - README.md
